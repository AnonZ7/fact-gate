<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="34" rx="14" fill="#0b1020"/>
  <rect x="0" y="20" width="880" height="14" fill="#0b1020"/>
  <circle cx="22" cy="17" r="6" fill="#ef4444"/>
  <circle cx="42" cy="17" r="6" fill="#f59e0b"/>
  <circle cx="62" cy="17" r="6" fill="#22c55e"/>
  <text x="440" y="22" text-anchor="middle" fill="#64748b" font-size="13">fact-gate — the PR description the agent wrote, checked against the diff it describes</text>

  <text x="24" y="66" fill="#94a3b8">$ <tspan fill="#e2e8f0">fact-gate --target pr-body.md --git origin/main</tspan></text>

  <text x="24" y="102" fill="#f87171" font-weight="bold" filter="url(#glow)">BLOCK</text>
  <text x="90" y="102" fill="#cbd5e1">pr-body.md — 4 claims: <tspan fill="#4ade80">0 verified</tspan>, <tspan fill="#fbbf24">0 unsupported</tspan>, <tspan fill="#f87171">4 fabricated</tspan></text>

  <g fill="#cbd5e1">
    <text x="40" y="136"><tspan fill="#f87171">[CRITICAL]</tspan> FABRICATED_COUNT: <tspan fill="#fde68a">"12 files"</tspan>  — source states <tspan fill="#4ade80">6 files (changed)</tspan>, not 12</text>
    <text x="40" y="162"><tspan fill="#f87171">[CRITICAL]</tspan> FABRICATED_COUNT: <tspan fill="#fde68a">"40 tests"</tspan>  — source states <tspan fill="#4ade80">4 tests (added)</tspan>, not 40</text>
    <text x="40" y="188"><tspan fill="#f87171">[CRITICAL]</tspan> FABRICATED_COUNT: <tspan fill="#fde68a">"300 lines"</tspan> — source states <tspan fill="#4ade80">6 lines (deleted)</tspan>, not 300</text>
    <text x="40" y="214"><tspan fill="#f87171">[CRITICAL]</tspan> FABRICATED_COUNT: <tspan fill="#fde68a">"0 dependencies"</tspan> — source states <tspan fill="#4ade80">1 dependencies (added)</tspan>, not 0</text>
  </g>

  <text x="24" y="254" fill="#64748b">exit 1 · 0 dependencies · 0 LLM calls · 3 ms</text>
  <text x="856" y="254" text-anchor="end" fill="#64748b">deterministic: same input, same verdict, every time</text>
  <text x="24" y="282" fill="#475569" font-size="13">"No new dependencies" was a lie too — the diff added zod. The gate reads "no" as a count of zero.</text>
</svg>
