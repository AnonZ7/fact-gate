<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <rect width="880" height="150" rx="14" fill="#0f172a"/>
  <g>
    <!-- CI -->
    <rect x="24" y="24" width="196" height="102" rx="12" fill="#1e293b" stroke="#334155"/>
    <circle cx="60" cy="56" r="14" fill="#16a34a"/>
    <path d="M52,56 l6,6 l10,-12" stroke="#052e16" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="61" fill="#e2e8f0" font-weight="600">GitHub Action</text>
    <text x="40" y="88" fill="#94a3b8" font-size="12">PR body vs the diff.</text>
    <text x="40" y="106" fill="#94a3b8" font-size="12">README vs measured facts.</text>

    <!-- hook -->
    <rect x="236" y="24" width="196" height="102" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="46" y="42" width="28" height="28" rx="6" fill="#7c3aed" transform="translate(212,0)"/>
    <path d="M266,50 l4,6 l-4,6 M274,62 h8" stroke="#ede9fe" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="296" y="61" fill="#e2e8f0" font-weight="600">Claude Code hook</text>
    <text x="252" y="88" fill="#94a3b8" font-size="12">Denies the Write, returns the</text>
    <text x="252" y="106" fill="#94a3b8" font-size="12">reasons. The agent fixes it.</text>

    <!-- CLI -->
    <rect x="448" y="24" width="196" height="102" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="470" y="42" width="28" height="28" rx="6" fill="#0891b2"/>
    <text x="484" y="62" text-anchor="middle" fill="#ecfeff" font-family="ui-monospace, monospace" font-size="15" font-weight="700">&gt;_</text>
    <text x="508" y="61" fill="#e2e8f0" font-weight="600">CLI</text>
    <text x="464" y="88" fill="#94a3b8" font-size="12">npx fact-gate · exit 0 / 1 / 2</text>
    <text x="464" y="106" fill="#94a3b8" font-size="12">text · json · markdown · github</text>

    <!-- library -->
    <rect x="660" y="24" width="196" height="102" rx="12" fill="#1e293b" stroke="#334155"/>
    <rect x="682" y="42" width="28" height="28" rx="6" fill="#d97706"/>
    <path d="M690,50 h12 M690,56 h12 M690,62 h8" stroke="#fffbeb" stroke-width="2.5" stroke-linecap="round"/>
    <text x="720" y="61" fill="#e2e8f0" font-weight="600">Library</text>
    <text x="676" y="88" fill="#94a3b8" font-size="12">verifyFacts() in the generation</text>
    <text x="676" y="106" fill="#94a3b8" font-size="12">loop. Typed. Zero deps.</text>
  </g>
</svg>
